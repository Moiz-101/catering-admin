<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B33">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enquiries">
<title>Enquiries · Dragon Empire Catering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F7F1E6;color:#1B2B27;font-family:'DM Sans',system-ui,sans-serif;
     display:flex;justify-content:center;align-items:stretch}
input,select,button,textarea{font-family:inherit}
.shell{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:#F7F1E6;overflow:hidden;position:relative}

header{background:#0E3B33;padding:10px 16px 10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header img{height:30px;width:auto;display:block}
header .t{display:flex;flex-direction:column;gap:1px;min-width:0}
header .t b{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:19px;color:#FBF6EA;line-height:1.1}
header .t span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#C9D6D1}
header .more{position:relative;margin-left:auto;background:transparent;border:1.5px solid #C9963B;color:#E9C77E;
     border-radius:10px;height:34px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;
     line-height:1;display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ---------- filters live at the foot, where the thumb is ---------- */
#bar[hidden]{display:none}
#bar{flex-shrink:0;background:#EADFC8;border-top:1px solid #D9CBAB;padding:8px 16px}
#bar button{width:100%;height:42px;border-radius:12px;border:1.5px solid #C8BCA2;background:#FBF6EA;
     color:#0E3B33;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;
     justify-content:center;gap:8px}
#bar button.on{border-color:#C62828;background:#FDECEA;color:#9B1C1C}
#bar .tag{font-weight:600;color:#5A6863}
#bar button.on .tag{color:#9B1C1C}

/* ---------- the drop-down of filters and settings ---------- */
#menu[hidden]{display:none}
#menu{position:absolute;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(14,59,51,.35);
     display:flex;flex-direction:column;justify-content:flex-end}
#menu .panel{border-top:1.5px solid #D9CBAB;border-bottom:none;border-radius:18px 18px 0 0;
     box-shadow:0 -8px 22px rgba(14,59,51,.22)}
/* ---------- the Manage sheet drops from the header ---------- */
#manage[hidden]{display:none}
#manage{position:absolute;top:0;left:0;right:0;bottom:0;z-index:31;background:rgba(14,59,51,.35)}
#manage .panel{background:#FBF6EA;border-bottom:1.5px solid #D9CBAB;padding:10px 16px 16px;
     display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px rgba(14,59,51,.2);
     max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#manage h4{margin:6px 2px 2px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#7A6A4A;font-weight:700}
#manage button{text-align:left;background:transparent;border:none;border-radius:10px;padding:12px;
     font-size:15px;font-weight:600;color:#1B2B27;cursor:pointer;display:flex;align-items:center;gap:10px}
#manage button:hover{background:#EADFC8}
#manage .danger{color:#9B1C1C}
#manage hr{border:none;border-top:1px solid #E4D9C2;margin:6px 0}
#manage .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
     padding:2px 2px 6px;border-bottom:1px solid #E4D9C2;margin-bottom:2px}
#manage .mhead span{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;color:#0E3B33}
#manage button.x{width:36px;height:36px;padding:0;justify-content:center;font-size:24px;
     line-height:1;color:#0E3B33;background:#EADFC8;border-radius:10px;flex-shrink:0}
#menu .panel{background:#FBF6EA;border-bottom:1.5px solid #D9CBAB;padding:10px 16px 16px;
     display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px rgba(14,59,51,.2);
     max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#menu .dates{display:flex;gap:8px;padding:2px 2px 6px}
#menu .dates label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;
     font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#7A6A4A;font-weight:700}
#menu .dates input{height:40px;border:1.5px solid #DDD3BF;border-radius:10px;padding:0 8px;
     font-size:15px;background:#fff;color:#1B2B27;width:100%;-webkit-appearance:none;line-height:38px}
#menu .apply{justify-content:center;background:#0E3B33;color:#FBF6EA;font-weight:700;margin:0 2px 2px}
#menu .clear{justify-content:center;background:#EADFC8;color:#0E3B33;font-weight:700;margin:2px}
header .more.on::before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
     background:#C62828;transform:translate(13px,-11px);border:1.5px solid #0E3B33}
#menu .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
     padding:2px 2px 6px;border-bottom:1px solid #E4D9C2;margin-bottom:2px}
#menu .mhead span{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;color:#0E3B33}
#menu button.x{width:36px;height:36px;padding:0;justify-content:center;font-size:24px;
     line-height:1;color:#0E3B33;background:#EADFC8;border-radius:10px;flex-shrink:0}
#menu h4{margin:6px 2px 2px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#7A6A4A;font-weight:700}
#menu button{text-align:left;background:transparent;border:none;border-radius:10px;padding:11px 12px;
     font-size:15px;font-weight:600;color:#1B2B27;cursor:pointer;display:flex;align-items:center;gap:8px}
#menu button[aria-checked="true"]{background:#EADFC8;color:#0E3B33}
#menu button[aria-checked="true"]::after{content:'✓';margin-left:auto;color:#0E3B33;font-weight:700}
#menu .danger{color:#9B1C1C}
#menu hr{border:none;border-top:1px solid #E4D9C2;margin:6px 0}

/* ---------- the two status tabs ---------- */
#tabs[hidden]{display:none}
#tabs{display:flex;gap:6px;padding:8px 16px;background:#EADFC8;border-bottom:1px solid #D9CBAB;flex-shrink:0}
#tabs button{flex:1 1 0;min-width:0;height:40px;border-radius:11px;border:none;cursor:pointer;
     font-size:13px;font-weight:700;color:#0E3B33;background:transparent;
     display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
#tabs button[aria-selected="true"]{background:#FFFFFF;box-shadow:0 1px 3px rgba(14,59,51,.18)}

main{flex-grow:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
     padding:14px 16px 28px 16px;display:flex;flex-direction:column;gap:10px}
main > *,#sheetBody > *{flex-shrink:0}

.card{background:#fff;border:1.5px solid #E4D9C2;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
/* an order you have not opened yet: the date stamp turns red and grows a dot */
.card.unseen{border-color:#F0CBC6}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;line-height:1.15;color:#0E3B33;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* name, then the event date and headcount, then the stamp - all on one line.
   A long name gives way first, because the whole of it is in the order sheet. */
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.ev{font-size:13.5px;font-weight:700;color:#1B2B27;white-space:nowrap;flex-shrink:0}
.meta{font-size:13.5px;line-height:1.45;color:#4A5A55}
.meta b{color:#1B2B27;font-weight:700}
.when{font-size:11.5px;font-weight:700;color:#5A6863;white-space:nowrap;flex-shrink:0;
     background:#F3EDE0;border:1px solid #E4D9C2;border-radius:8px;padding:3px 8px}
.card.unseen .when{background:#FDECEA;border-color:#E9B4AE;color:#9B1C1C}
.when .newdot{display:inline-block;width:7px;height:7px;border-radius:50%;
     background:#C62828;margin-right:5px;vertical-align:1px}
.ref{font-size:12px;font-weight:700;letter-spacing:.5px;color:#6A4E12}

/* ---------- the 5-step bar, same shape as the customer sees ---------- */
.steps{display:flex;align-items:flex-start;padding:3px 0 1px}
.steps .st{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.steps .st::before{content:'';position:absolute;left:-50%;top:10px;width:100%;height:2px;background:#EADFC8}
.steps .st:first-child::before{display:none}
.steps .st.joined::before{background:#0E3B33}
.steps .dot{position:relative;z-index:1;width:22px;height:22px;flex-shrink:0;border-radius:50%;
     display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
     background:#EADFC8;color:#A08F6B}
.steps .dot.done{background:#0E3B33;color:#E9C77E}
.steps .dot.now{background:#C9963B;color:#2A1B02;box-shadow:0 0 0 3px rgba(201,150,59,.25)}
.steps em{font-style:normal;font-size:8.5px;line-height:1.1;text-align:center;color:#9AA5A1;
     letter-spacing:.2px;max-width:100%}
.steps .st.done em{color:#4A5A55}
.steps .st.now em{color:#8A5A00;font-weight:700}

.acts{display:flex;gap:7px}
.acts a,.acts button{flex:1 1 0;min-width:0;text-align:center;text-decoration:none;height:40px;line-height:38px;
     border-radius:12px;font-size:13.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer;padding:0}
.view{background:#C9963B;color:#2A1B02;border-color:#C9963B}
.wa{background:#25D366;color:#0B3D22;border-color:#1FB855}   /* WhatsApp's own green */
.call{background:#0E3B33;color:#FBF6EA;border-color:#0E3B33}

.muted{font-size:13.5px;color:#5A6863;text-align:center;padding:30px 12px;line-height:1.55}
.count{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:#4A5A55;padding:2px 2px 0}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:1.2px;
     text-transform:uppercase;font-weight:700;color:#4A5A55}
label.f input{height:44px;border:1.5px solid #DDD3BF;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:#1B2B27}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;
     border:1.5px solid #E4D9C2;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:#0E3B33;flex-shrink:0}
.save{height:46px;border:none;border-radius:14px;background:#0E3B33;color:#FBF6EA;font-size:16px;font-weight:700;cursor:pointer}
.note{font-size:12.5px;color:#5A6863;line-height:1.45}
.err{background:#FDECEA;border:1.5px solid #C62828;color:#9B1C1C;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45}
.ok{background:#D3E7DE;border:1.5px solid #2F7A64;color:#12604B;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45}

.screen h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;color:#0E3B33;margin:0}
.screen .back{background:#EADFC8;border:none;border-radius:10px;height:34px;padding:0 12px;
     font-size:13px;font-weight:700;color:#0E3B33;cursor:pointer;flex-shrink:0}
.screen .top{display:flex;align-items:center;gap:10px}
.screen .top h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* on a narrow phone the title gives up size before it gives up letters */
@media (max-width:359px){.screen .top{gap:6px}
  .screen .top h2{font-size:16px}
  .screen .top .back{padding:0 8px}
  .topsel{max-width:112px;font-size:12px;padding:0 4px}}
.topsel{margin-left:auto;flex-shrink:0;max-width:132px;height:36px;border:1.5px solid #DDD3BF;
     border-radius:10px;padding:0 6px;font-size:13px;font-weight:700;background:#fff;
     color:#0E3B33;cursor:pointer}
.search{height:42px;border:1.5px solid #DDD3BF;border-radius:12px;padding:0 12px;font-size:15px;background:#fff;color:#1B2B27;width:100%}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E4D9C2;
     border-radius:13px;padding:9px 11px}
.mrow .nm{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;color:#1B2B27;line-height:1.3}
.mrow .nm small{display:block;font-size:11px;font-weight:600;color:#8A9491;letter-spacing:.3px;text-transform:uppercase}
.mrow.off{opacity:.55}
.mrow .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.p-on{background:#D3E7DE;color:#12604B}
.p-off{background:#FDECEA;color:#9B1C1C}
.mrow button{flex-shrink:0;height:32px;padding:0 10px;border-radius:9px;border:1.5px solid #0E3B33;
     background:#fff;color:#0E3B33;font-size:12.5px;font-weight:700;cursor:pointer}
.p-warn{background:#FBEFD6;color:#8A5A00}

/* ---------- dish photos ---------- */
.thumb{width:46px;height:46px;flex-shrink:0;border-radius:10px;object-fit:cover;
     background:#F3EDE0;border:1px solid #E4D9C2;display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;text-align:center;
     font-size:9px;font-weight:700;line-height:1.1;color:#A99C7E;letter-spacing:.3px}
.mini-x{flex-shrink:0;height:32px;min-width:32px;padding:0 8px;border-radius:9px;
     border:1.5px solid #E5B4AE;background:#fff;color:#9B1C1C;font-size:15px;font-weight:700;cursor:pointer}
.brow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E4D9C2;
     border-radius:13px;padding:9px 11px}
.brow.done{opacity:.6}
.brow .bmid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.brow .bfile{font-size:12px;font-weight:700;color:#4A5A55;word-break:break-all;line-height:1.25}
.brow select{height:38px;border:1.5px solid #DDD3BF;border-radius:10px;padding:0 8px;
     font-size:14px;background:#fff;color:#1B2B27;width:100%;max-width:100%}
.brow .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.brow .err,.brow .ok{padding:6px 9px;font-size:11.5px;border-radius:9px}
.warn{background:#FBEFD6;border:1.5px solid #C9963B;color:#8A5A00;border-radius:9px;
     padding:6px 9px;font-size:11.5px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:1px;
     text-transform:uppercase;font-weight:700;color:#4A5A55}
.field input,.field select,.field textarea{height:44px;border:1.5px solid #DDD3BF;border-radius:12px;
     padding:0 11px;font-size:15px;background:#fff;color:#1B2B27;width:100%;-webkit-appearance:none}
.field textarea{height:66px;padding:10px 11px;resize:vertical}
.two{display:flex;gap:10px}.two > *{flex:1 1 0;min-width:0}
.danger-btn{height:44px;border:1.5px solid #C62828;border-radius:12px;background:#fff;color:#9B1C1C;
     font-size:14px;font-weight:700;cursor:pointer}
.rpt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E4D9C2;
     border-radius:14px;padding:11px 13px;cursor:pointer;text-align:left;width:100%}
.rpt b{font-size:14px;color:#0E3B33;display:block}
.rpt span{font-size:12px;color:#5A6863;line-height:1.35;display:block;margin-top:2px}
.rpt .go{margin-left:auto;flex-shrink:0;color:#C9963B;font-size:19px;font-weight:700}
.login{margin:auto;width:100%;max-width:330px;display:flex;flex-direction:column;gap:12px;padding:20px}
.login h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0;color:#0E3B33;text-align:center}

/* ---------- the order sheet ---------- */
#sheet[hidden]{display:none}
#sheet{position:absolute;inset:0;background:#F7F1E6;z-index:20;display:flex;flex-direction:column}
#sheet .bar{background:#0E3B33;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#sheet .bar button{background:transparent;border:1.5px solid #C9963B;color:#E9C77E;border-radius:10px;
     height:34px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer}
#sheet .bar b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;color:#FBF6EA;
     margin-left:auto;letter-spacing:.3px}
#sheetBody{flex-grow:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px 16px;
     display:flex;flex-direction:column;gap:10px}
.sec{background:#fff;border:1.5px solid #E4D9C2;border-radius:16px;overflow:hidden}
.sec h3{margin:0;background:#EADFC8;padding:8px 14px;font-family:'Fraunces',Georgia,serif;
     font-weight:600;font-size:14px;color:#0E3B33;letter-spacing:.3px}
.sec .body{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.kv{display:flex;gap:10px;font-size:13.5px;line-height:1.4}
.kv span{color:#5A6863;flex:0 0 40%}
.kv b{color:#1B2B27;font-weight:600;flex:1 1 auto}
.dish{font-size:13.5px;line-height:1.45;color:#1B2B27;display:flex;gap:7px}
.dish i{color:#C9963B;font-style:normal;flex-shrink:0}
.dish em{display:block;font-style:normal;font-size:12px;color:#8A6D2F;margin-top:1px}
.tot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;line-height:1.4}
.tot.big{border-top:1.5px solid #E4D9C2;padding-top:8px;margin-top:2px;font-size:16px}
.tot.big b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;color:#0E3B33}
</style>
</head>
<body>
<div class="shell">
  <header>
    <img src="images/logo.png" alt="">
    <div class="t"><span>Dragon Empire</span><b>Enquiries</b></div>
    <button class="more" id="more" hidden aria-label="Manage">Manage &#9662;</button>
  </header>

  <div id="tabs" hidden>
    <button data-view="progress" aria-selected="true">In Progress</button>
    <button data-view="confirmed" aria-selected="false">Confirmed</button>
  </div>

  <main id="main">
    <div class="login" id="login">
      <h1>Sign in</h1>
      <label class="f">Email
        <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com">
      </label>
      <label class="f">Password
        <input id="pass" type="password" autocomplete="current-password" placeholder="Your password">
      </label>
      <button class="save" id="send">Sign in</button>
      <div id="loginMsg"></div>
      <div class="note" style="text-align:center">You stay signed in on this phone, so this is a one-off.</div>
    </div>
  </main>

  <footer id="bar" hidden>
    <button id="filtersBtn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      <span>Filters</span><span class="tag" id="filterTag"></span>
    </button>
  </footer>

  <div id="menu" hidden><div class="panel" id="menuPanel"></div></div>
  <div id="manage" hidden><div class="panel" id="managePanel"></div></div>

  <div id="sheet" hidden>
    <div class="bar">
      <button id="sheetBack">Back</button>
      <button id="sheetPdf">Save PDF</button>
      <b id="sheetRef"></b>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

  /* Dubai never changes its clock, so "today" is simply the day there now. */
  function dayStart() {
    var ymd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dubai' }).format(new Date());
    return new Date(ymd + 'T00:00:00+04:00');
  }

  function inRange(l) {
    var t = new Date(l.updated_at).getTime();
    if (F.range === 'today') return t >= dayStart().getTime();
    if (F.range === 'week')  return t >= Date.now() - 7 * 86400000;
    if (F.range === 'custom') {
      // the boxes are Dubai days, and "to" means the whole of that day
      if (F.from && t < new Date(F.from + 'T00:00:00+04:00').getTime()) return false;
      if (F.to   && t > new Date(F.to   + 'T23:59:59+04:00').getTime()) return false;
      return true;
    }
    return true;
  }

  // the three bands meet with no gap, so every enquiry lands in exactly one
  function fitsSize(l) {
    if (F.size === 'any') return true;
    if (!(l.pax > 0)) return false;             // no guest count, no opinion
    if (F.size === 'under30') return l.pax < 30;

        if (!b.event_date) return -1;

  /* When it happened, in Dubai time. Inside the last 24 hours the clock time is
     what you want ("was that before or after lunch?"); older than that, the day
     itself is the useful fact. "3d ago" told you neither. */
  // assembled from parts so the order is always "17 Sep", never "Sep 17",
  // and the month stays three letters whatever the phone's locale data says
  function dubaiParts(d, opts) {
    opts.timeZone = 'Asia/Dubai';
    var out = {};
    new Intl.DateTimeFormat('en-US', opts).formatToParts(d).forEach(function (p) { out[p.type] = p.value; });
    return out;
  }

  function stamp(iso) {
    if (!iso) return '';
    var t = new Date(iso);
    if (isNaN(t.getTime())) return '';
    var age = Date.now() - t.getTime();

    if (age < 86400000 && age > -300000) {
      var c = dubaiParts(t, { hour: 'numeric', minute: '2-digit', hour12: true });
      return c.hour + ':' + c.minute + ' ' + (c.dayPeriod || '');
    }

    var p = dubaiParts(t, { day: '2-digit', month: 'short', year: 'numeric' });
    var thisYear = dubaiParts(new Date(), { year: 'numeric' }).year;
    return p.day + ' ' + p.month.slice(0, 3) + (p.year === thisYear ? '' : ' ' + p.year.slice(2));
  }

  var STEP_NAME = { details:'their details', setup:'the setup', pkg:'packages',

  function stepNo(step) {
    var i = FLOW.indexOf(step);

  }

  var STEP_SHORT = ['Details', 'Setup', 'Package', 'Dishes', 'Theme'];

  function stepBar(l) {
    var at = stepNo(l.step);
    var atReview = (l.step === 'review' || l.step === 'thanks');
    var html = '<div class="steps" aria-label="Reached step ' + at + ' of 5">';
    for (var n = 1; n <= 5; n++) {
      var done = n < at || (n === at && atReview);
      var now = n === at && !atReview;
      html += '<div class="st' + (done ? ' done' : '') + (now ? ' now' : '') +
              (n <= at ? ' joined' : '') + '">' +
                '<span class="dot' + (done ? ' done' : (now ? ' now' : '')) + '">' + n + '</span>' +
                '<em>' + STEP_SHORT[n - 1] + '</em>' +
              '</div>';
    }
    return html + '</div>';
  }

  /* ---------------- rebuilding a customer's order ---------------- */

  function rebuild(l) {
    var o = (l.details || {}).order;
    // a top-level `class` is a global binding, not a property of window
    if (!o || !o.choices || typeof Component !== 'function') return null;
    var inst;
    try { inst = new Component({}); } catch (e) { return null; }
    Object.assign(inst.state, o.choices);
    // only a confirmed order has a number; don't invent one for an enquiry
    inst.REF = l.ref || 'DRAFT';

    // dishes are matched by name and course, so an order survives menu changes
    var sel = {}, notes = {};
    (o.picked || []).forEach(function (p) {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        var x = inst.ITEMS[i];
        if (x.name === p.name && x.cat === p.cat && !sel[x.id]) {
          sel[x.id] = true;
          if (p.note) notes[x.id] = p.note;
          return;
        }
      }
    });
    inst.state.sel = sel;
    inst.state.notes = notes;
    try { inst.summary(); } catch (e) { return null; }

  /* Confirmed orders for the chosen dates, plus any order you have not opened
     yet even when it falls outside them, because an unchecked order is the one
     thing the filter must never hide. Unopened ones sit at the top. */
  function confirmedList() {
    var done = rows.filter(function (l) { return l.status === 'completed'; });
    var shown = sift(done);
    var missed = done.filter(function (l) { return !l.seen_at && shown.indexOf(l) === -1; });
    var inRange = shown.filter(function (l) { return l.seen_at; });
    return shown.filter(function (l) { return !l.seen_at; }).concat(missed).concat(inRange);
  }

  function shortDay(ymd) {
    var p = String(ymd).split('-');
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1] || '';
    return p[2] + ' ' + m;

  /* ---------------- uploading a whole menu ---------------- */

  var upParsed = null;       // { rows, errors } from the last file read

  // a small CSV reader that copes with quoted fields and commas inside them
  function parseCSV(text) {
    var rows = [], row = [], cell = '', q = false;
    text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ''; }); });
  }

  var COURSE_WORDS = {
    starter: 'starter', starters: 'starter', appetiser: 'starter', appetizer: 'starter',
    main: 'main', mains: 'main', 'main course': 'main', curry: 'main',
    rice: 'rice', noodle: 'noodle', noodles: 'noodle',
    biryani: 'biryani', bread: 'bread', breads: 'bread',
    dessert: 'dessert', desserts: 'dessert', sweet: 'dessert'
  };
  var CU_WORDS = { indian: 'in', india: 'in', 'in': 'in', chinese: 'ch', china: 'ch', 'ch': 'ch' };
  var DIET_WORDS = {
    veg: 'veg', vegetarian: 'veg', v: 'veg',
    nonveg: 'nonveg', 'non-veg': 'nonveg', 'non veg': 'nonveg', nv: 'nonveg', 'non vegetarian': 'nonveg'
  };

  function readMenuFile(text) {
    var rows = parseCSV(text);
    if (!rows.length) return { rows: [], errors: ['The file is empty.'] };

    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var looksLikeHeader = head.indexOf('name') !== -1 || head.indexOf('dish') !== -1;
    var idx = {
      name: Math.max(head.indexOf('name'), head.indexOf('dish')),
      cat: Math.max(head.indexOf('course'), head.indexOf('category'), head.indexOf('cat')),
      cu: Math.max(head.indexOf('cuisine'), head.indexOf('cu')),
      diet: Math.max(head.indexOf('diet'), head.indexOf('veg')),
      sub: Math.max(head.indexOf('group'), head.indexOf('sub'), head.indexOf('section')),
      note: head.indexOf('note')
    };
    if (!looksLikeHeader) idx = { name: 0, cat: 1, cu: 2, diet: 3, sub: 4, note: 5 };

    var out = [], errors = [], seen = {};
    rows.slice(looksLikeHeader ? 1 : 0).forEach(function (r, n) {
      var line = n + (looksLikeHeader ? 2 : 1);
      var val = function (k) { return idx[k] >= 0 && r[idx[k]] != null ? String(r[idx[k]]).trim() : ''; };
      var name = val('name');
      if (!name) return;
      var cat = COURSE_WORDS[val('cat').toLowerCase()];
      var cu = CU_WORDS[val('cu').toLowerCase()];
      if (!cat) { errors.push('Line ' + line + ': "' + val('cat') + '" is not a course I know (' + name + ')'); return; }
      if (!cu) { errors.push('Line ' + line + ': "' + val('cu') + '" is not Indian or Chinese (' + name + ')'); return; }
      var diet = DIET_WORDS[val('diet').toLowerCase()] || null;
      var key = [name.toLowerCase(), cat, cu, diet || ''].join('|');
      if (seen[key]) { errors.push('Line ' + line + ': ' + name + ' appears twice in the file'); return; }
      seen[key] = 1;
      out.push({ name: name, cat: cat, cu: cu, diet: diet,
                 sub: val('sub') || null, note: val('note') || null, sort: out.length });
    });
    if (!out.length && !errors.length) errors.push('No dishes found. Check the column headings.');
    return { rows: out, errors: errors };
  }

  function menuTemplate() {
    var lines = ['name,course,cuisine,diet,group,note'];
    menuRows.slice(0, 400).forEach(function (d) {
      lines.push([d.name, d.cat, d.cu === 'ch' ? 'Chinese' : 'Indian',
                  d.diet || '', d.sub || '', d.note || '']
        .map(function (v) { return /[",]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v; })
        .join(','));
    });
    return lines.join('\n');
  }

        ' not in the file. They are hidden from customers but kept, so this can be undone.</div>' +

  async function applyUpload(replace, missing) {
    var msg = document.getElementById('uMsg');
    msg.className = 'note'; msg.textContent = 'Saving…';

    var have = {};
    menuRows.forEach(function (d) { have[[d.name.toLowerCase(), d.cat, d.cu, d.diet || ''].join('|')] = d; });

    var inserts = [], updates = [];
    upParsed.rows.forEach(function (r, i) {
      var ex = have[[r.name.toLowerCase(), r.cat, r.cu, r.diet || ''].join('|')];
      if (ex) updates.push({ id: ex.id, sub: r.sub, note: r.note, sort: i, active: true });
      else inserts.push({ name: r.name, cat: r.cat, cu: r.cu, diet: r.diet, sub: r.sub, note: r.note, sort: i });
    });

    try {
      if (inserts.length) {
        for (var i = 0; i < inserts.length; i += 100) {
          var r1 = await sb.from('menu_items').insert(inserts.slice(i, i + 100));
          if (r1.error) throw new Error(r1.error.message);
        }
      }
      for (var j = 0; j < updates.length; j++) {
        var u = updates[j];
        var r2 = await sb.from('menu_items').update({ sub: u.sub, note: u.note, sort: u.sort, active: true }).eq('id', u.id);
        if (r2.error) throw new Error(r2.error.message);
      }
      if (replace && missing && missing.length) {
        for (var k = 0; k < missing.length; k++) {
          var r3 = await sb.from('menu_items').update({ active: false }).eq('id', missing[k].id);
          if (r3.error) throw new Error(r3.error.message);
        }
      }
      msg.className = 'ok';
      msg.textContent = 'Done. ' + inserts.length + ' added, ' + updates.length + ' updated' +
        (replace && missing ? ', ' + missing.length + ' switched off' : '') +
        '. Customers see it now.';
      upParsed = null;
      await loadMenu();
    } catch (e) {
      msg.className = 'err';
      msg.textContent = 'Stopped: ' + e.message + '. Anything already saved has been kept.';
    }
  }

  async function makeReport(id) {
    if (!rows.length) await load();
    var all = rows;
    var orders = all.filter(function (l) { return l.status === 'completed' && inReportRange(l.completed_at || l.updated_at); });
    var stopped = all.filter(function (l) { return l.status !== 'completed' && inReportRange(l.updated_at); });
    var sub = rangeText();
    var spec = null;

    if (id === 'orders') {
      orders.sort(function (a, b) { return (a.completed_at || '') < (b.completed_at || '') ? 1 : -1; });
      spec = {
        title: 'Confirmed orders', subtitle: sub,
        columns: [{ label: 'Order', w: 1.1, bold: true }, { label: 'Customer', w: 1.6 },
                  { label: 'Placed', w: .9 }, { label: 'Event', w: .9 },
                  { label: 'Guests', w: .7, right: true }, { label: 'Package', w: 1.1 },
                  { label: 'Total', w: 1, right: true, bold: true }],

  /* ---------------- dish photos ----------------

     Photos live in Supabase Storage, not in the website's files, so a photo
     added here is on the customer's page the next time it loads. Nothing is
     rebuilt and nothing is deployed.

     Every photo is shrunk and re-encoded here, on the phone, before it is
     sent. A photo straight off a camera is 4-8MB; what leaves is nearer 150KB.
     That is the difference between a menu that loads on hotel wifi and one
     that does not.
     ------------------------------------------------------------------ */

  var photoSearch = '';
  var photoCat = '';          // '' is every course
  var BUCKET = 'dishes';

  /* ---- matching a filename to a dish ----

     The rule is "name the file after the dish", but nobody types a filename
     that carefully. This strips away everything that is not the dish's name -
     the extension, "- Copy", "(2)", camera numbers, underscores, accents -
     and then scores what is left. It proposes; you confirm. It never renames
     a photo onto a dish on its own. */

  function normName(s) {
    var t = String(s || '').toLowerCase();
    // NFD splits an accent off its letter, so dropping everything outside
    // plain ASCII turns "Puree" and an accented "Puree" into the same thing
    try { t = t.normalize('NFD').replace(/[^\x00-\x7f]/g, ''); } catch (e) {}
    t = t.replace(/\.[a-z0-9]{2,5}$/, '');              // .jpg, .jpeg, .heic
    // "(2)" and "(copy)" are noise, but "(Half)" is how Raan Biryani (Half)
    // is told apart from Raan Biryani (Special), so that stays as words
    t = t.replace(/\(\s*(?:\d+|copy(?:\s*\d+)?)\s*\)/g, ' ');
    t = t.replace(/[()]/g, ' ');
    t = t.replace(/[_\-]+/g, ' ');
    t = t.replace(/\b(copy|final|new|edited?|img|image|photo|pic|dsc|pxl|whatsapp|screenshot)\b/g, ' ');
    t = t.replace(/\b\d{3,}\b/g, ' ');                  // 20240817, IMG 4821
    t = t.replace(/[^a-z0-9 ]+/g, ' ');
    return t.replace(/\s+/g, ' ').trim();
  }

  // how alike two strings are, 0 to 1, by counting shared letter pairs
  function dice(a, b) {
    if (!a || !b) return 0;
    function grams(s) {
      var m = {}, t = ' ' + s + ' ', i, g;
      for (i = 0; i < t.length - 1; i++) { g = t.substr(i, 2); m[g] = (m[g] || 0) + 1; }
      return m;
    }
    var A = grams(a), B = grams(b), hit = 0, na = 0, nb = 0, k;
    for (k in A) na += A[k];
    for (k in B) nb += B[k];
    for (k in A) if (B[k]) hit += Math.min(A[k], B[k]);
    return (na + nb) ? (2 * hit) / (na + nb) : 0;
  }

  // "chicken tikka" inside "chicken tikka masala" should score well even though
  // the letter pairs alone would punish the extra word
  function tokenScore(a, b) {
    var A = a.split(' ').filter(Boolean), B = b.split(' ').filter(Boolean);
    if (!A.length || !B.length) return 0;
    var small = A.length <= B.length ? A : B, big = A.length <= B.length ? B : A;
    var hit = 0;
    small.forEach(function (w) { if (big.indexOf(w) !== -1) hit++; });
    var covered = hit / small.length;
    return covered === 1 ? 0.80 + 0.15 * (small.length / big.length) : covered * 0.7;
  }

  function scoreOf(fileNorm, dishNorm) {
    if (!fileNorm || !dishNorm) return 0;
    if (fileNorm === dishNorm) return 1;
    if (fileNorm.replace(/ /g, '') === dishNorm.replace(/ /g, '')) return 0.99;
    return Math.max(dice(fileNorm, dishNorm), tokenScore(fileNorm, dishNorm));
  }

  // best dish for one filename, out of the dishes still on the menu
  function matchDish(filename, pool) {
    var f = normName(filename), best = null, bestScore = 0, runnerUp = 0;
    pool.forEach(function (d) {
      var s = scoreOf(f, normName(d.name));
      if (s > bestScore) { runnerUp = bestScore; bestScore = s; best = d; }
      else if (s > runnerUp) runnerUp = s;
    });
    return { dish: best, score: bestScore, close: bestScore - runnerUp < 0.06 && bestScore > 0 };
  }

  /* ---- shrinking, on this phone, before anything is sent ---- */

  function shrink(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var done = function (bmp, w, h) {
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';                 // a PNG's transparency would go black
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(bmp, 0, 0, cw, ch);
        if (bmp.close) try { bmp.close(); } catch (e) {}
        cv.toBlob(function (b) {
          if (b) resolve(b); else reject(new Error('could not re-encode'));
        }, 'image/jpeg', quality);
      };

      if (window.createImageBitmap) {
        // from-image keeps a phone photo the right way up
        createImageBitmap(file, { imageOrientation: 'from-image' })
          .then(function (bmp) { done(bmp, bmp.width, bmp.height); })
          .catch(function () { viaImg(); });
      } else viaImg();

      function viaImg() {
        var url = URL.createObjectURL(file), im = new Image();
        im.onload = function () { URL.revokeObjectURL(url); done(im, im.naturalWidth, im.naturalHeight); };
        im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('not an image this phone can read')); };
        im.src = url;
      }
    });
  }

  function publicUrl(path) {
    var r = sb.storage.from(BUCKET).getPublicUrl(path);
    return (r && r.data && r.data.publicUrl) || '';
  }

  // the object's path inside the bucket, read back out of the stored address
  function pathOf(url) {
    var m = String(url || '').match(/\/object\/public\/dishes\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  /* Put one photo on one dish: shrink, send, point the dish at it, and only
     then throw the old one away, so a failure anywhere leaves the dish with
     the photo it already had. */
  async function setPhoto(dish, file) {
    var blob = await shrink(file, 1000, 0.82);
    var path = 'dish/' + dish.id + '-' + Date.now() + '.jpg';
    var up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw new Error(up.error.message);

    var url = publicUrl(path);
    var r = await sb.from('menu_items').update({ img: url }).eq('id', dish.id);
    if (r.error) {
      sb.storage.from(BUCKET).remove([path]);          // do not leave it orphaned
      throw new Error(r.error.message);
    }
    var old = pathOf(dish.img);
    if (old && old !== path) sb.storage.from(BUCKET).remove([old]);
    dish.img = url;
    return url;
  }

  async function clearPhoto(dish) {
    var r = await sb.from('menu_items').update({ img: null }).eq('id', dish.id);
    if (r.error) throw new Error(r.error.message);
    var old = pathOf(dish.img);
    if (old) sb.storage.from(BUCKET).remove([old]);
    dish.img = null;
  }

  function confidence(r) {
    if (!r.dishId) return ['p-off', 'no match'];
    if (r.close) return ['p-warn', 'two dishes fit'];
    if (r.score >= 0.9) return ['p-on', 'sure'];
    if (r.score >= 0.7) return ['p-on', 'likely'];
    return ['p-warn', 'check this'];
  }

  function paintBulk() {
    var out = document.getElementById('bOut');
    var pool = menuRows.filter(function (d) { return d.active; });
    var opts = '<option value="">— skip this photo —</option>' +
      COURSES.map(function (c) {
        var inC = pool.filter(function (d) { return d.cat === c[0]; });
        if (!inC.length) return '';
        return '<optgroup label="' + esc(c[1]) + '">' +
          inC.map(function (d) {
            return '<option value="' + d.id + '">' + esc(d.name) +
              (d.diet ? ' (' + (d.diet === 'veg' ? 'veg' : 'non-veg') + ')' : '') + '</option>';
          }).join('') + '</optgroup>';
      }).join('');

    // two photos aimed at one dish: the second would quietly replace the first
    var count = {};
    bulkRows.forEach(function (r) { if (r.dishId) count[r.dishId] = (count[r.dishId] || 0) + 1; });

    var ready = bulkRows.filter(function (r) { return r.dishId && !r.done; }).length;
    var unmatched = bulkRows.filter(function (r) { return !r.dishId; }).length;

    out.innerHTML =
      '<div class="count">' + bulkRows.length + ' photo' + (bulkRows.length === 1 ? '' : 's') +
        ' &middot; ' + ready + ' ready' + (unmatched ? ' &middot; ' + unmatched + ' need a dish' : '') + '</div>' +
      bulkRows.map(function (r, i) {
        var c = confidence(r);
        return '<div class="brow' + (r.done ? ' done' : '') + '">' +
          '<img class="thumb" src="' + esc(r.url) + '" alt="">' +
          '<div class="bmid">' +
            '<div class="bfile">' + esc(r.name) + '</div>' +
            (r.done ? '<div class="ok">On the menu</div>'
                    : '<select data-pick="' + i + '">' + opts + '</select>') +
            (r.err ? '<div class="err">' + esc(r.err) + '</div>' : '') +
            (!r.done && r.dishId && count[r.dishId] > 1
              ? '<div class="warn">Another photo is going to this dish too</div>' : '') +
          '</div>' +
          '<span class="pill ' + c[0] + '">' + c[1] + '</span>' +
        '</div>';
      }).join('') +
      (ready ? '<button class="save" id="bGo">Upload ' + ready + ' photo' + (ready === 1 ? '' : 's') + '</button>' : '') +
      '<div id="bMsg"></div>';

    [].forEach.call(out.querySelectorAll('[data-pick]'), function (s) {
      s.value = bulkRows[+s.dataset.pick].dishId || '';
      s.onchange = function () {
        var r = bulkRows[+s.dataset.pick];
        r.dishId = s.value;
        r.score = s.value ? 1 : 0;       // you chose it, so it is right
        r.close = false;
        paintBulk();
      };
    });

    var go = document.getElementById('bGo');
    if (go) go.onclick = runBulk;
  }

  async function runBulk() {
    var go = document.getElementById('bGo'), msg = document.getElementById('bMsg');
    go.disabled = true;
    var todo = bulkRows.filter(function (r) { return r.dishId && !r.done; });
    var ok = 0, failed = 0;

    for (var i = 0; i < todo.length; i++) {
      var r = todo[i];
      msg.className = 'note';
      msg.textContent = 'Sending ' + (i + 1) + ' of ' + todo.length + '…';
      var dish = menuRows.filter(function (d) { return String(d.id) === String(r.dishId); })[0];
      try {
        await setPhoto(dish, r.file);
        r.done = true; r.err = ''; ok++;
      } catch (e) {
        r.err = e.message; failed++;
      }
    }

    paintBulk();
    var m = document.getElementById('bMsg');
    m.className = failed ? 'err' : 'ok';
    m.textContent = ok + ' photo' + (ok === 1 ? '' : 's') + ' added' +
      (failed ? ', ' + failed + ' did not go through - they are still listed above, try them again'
              : '. Customers see them now.');
  }

  SCREENS.dishes = screenDishes;
  SCREENS.upload = screenUpload;
  SCREENS.photos = screenPhotos;
  SCREENS.photobulk = screenPhotoBulk;
  SCREENS.stock = screenStock;
  SCREENS.packages = screenPackages;
  SCREENS.reports = screenReports;
  SCREENS.settings = showSettings;

  async function draw() {
    if (SCREENS[view]) { SCREENS[view](); return; }
    if (!rows.length) main.innerHTML = '<div class="muted">Loading…</div>';
    if (await load()) paintList();
  }

  [].forEach.call(tabs.querySelectorAll('button'), function (b) {
    b.onclick = function () {
      menu.hidden = true; manage.hidden = true;   // tapping a tab leaves any sheet
      bar.hidden = false;
      [].forEach.call(tabs.querySelectorAll('button'), function (x) { x.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      view = b.dataset.view;
      paintList();
    };
  });

  // and so is the back gesture, or Escape on a keyboard
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!manage.hidden) manage.hidden = true;
    else if (!menu.hidden) menu.hidden = true;
    else if (!sheet.hidden) { sheet.hidden = true; openInst = null; draw(); }
  });

  /* ---------------- the filter menu ---------------- */

  var panel = document.getElementById('menuPanel');

  function opt(kind, value, label, on) {
    return '<button data-' + kind + '="' + esc(value) + '" aria-checked="' + (on ? 'true' : 'false') + '">' +
           esc(label) + '</button>';
  }

  function buildMenu() {
    // a way out that does not involve choosing a filter first
    var html = '<div class="mhead"><span>Filters</span>' +
        '<button class="x" data-act="close" aria-label="Close">&times;</button></div>' +
      '<h4>Show</h4>' +
      opt('range', 'today',  'Today',        F.range === 'today') +
      opt('range', 'custom', 'Chosen dates', F.range === 'custom') +
      '<div class="dates">' +
        '<label>From<input type="date" id="fFrom" value="' + esc(F.from) + '"></label>' +
        '<label>To<input type="date" id="fTo" value="' + esc(F.to) + '"></label>' +
      '</div>' +
      '<button class="apply" data-act="applyDates">Use these dates</button>' +

      '<h4>Sort by</h4>' +
      opt('sort', 'recent', 'Latest activity',     F.sort === 'recent') +
      opt('sort', 'event',  'Event date, soonest', F.sort === 'event') +

      '<h4>Party size</h4>' +
      opt('size', 'any',     'Any size',      F.size === 'any') +
      opt('size', 'under30', 'Under 30',      F.size === 'under30') +
      opt('size', 'mid',     '30 to 50',      F.size === 'mid') +
      opt('size', 'over50',  'Over 50',       F.size === 'over50');

    if (filtersOn()) html += '<button class="clear" data-act="clear">Clear all filters</button>';
    panel.innerHTML = html;
    wireMenu();
  }

  function wireMenu() {
    [].forEach.call(panel.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var d = b.dataset;
        if (d.range)        { F.range = d.range; if (d.range !== 'custom') { F.from = ''; F.to = ''; } }
        else if (d.sort)    { F.sort = d.sort; }
        else if (d.size)    { F.size = d.size; }
        else if (d.act === 'applyDates') {
          F.from = document.getElementById('fFrom').value;
          F.to   = document.getElementById('fTo').value;
          F.range = (F.from || F.to) ? 'custom' : 'today';
        }
        else if (d.act === 'clear') { F = { range:'today', from:'', to:'', sort:'recent', size:'any' }; }
        else { menu.hidden = true; return; }           // Close: changed nothing, just leave
        menu.hidden = true;
        if (SCREENS[view]) backToList();
        paintList();
      };
    });
  }

  /* ---------------- Manage ---------------- */

  function buildManage() {
    managePanel.innerHTML =
      '<div class="mhead"><span>Manage</span>' +
        '<button class="x" data-m="close" aria-label="Close">&times;</button></div>' +
      '<h4>The menu</h4>' +
      '<button data-m="dishes">Dishes &amp; prices</button>' +
      '<button data-m="stock">Out of stock</button>' +
      '<button data-m="upload">Upload a whole menu</button>' +
      '<button data-m="photos">Dish photos</button>' +
      '<button data-m="packages">Packages &amp; themes</button>' +
      '<h4>Paperwork</h4>' +
      '<button data-m="reports">Reports</button>' +
      '<h4>Settings</h4>' +
      '<button data-m="settings">Alerts</button>' +
      '<button data-m="refresh">Refresh now</button>' +
      '<button data-m="signout" class="danger">Sign out</button>';

    [].forEach.call(managePanel.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        manage.hidden = true;
        var a = b.dataset.m;
        if (a === 'close') return;
        if (a === 'signout') { sb.auth.signOut().then(function () { location.reload(); }); return; }
        if (a === 'refresh') { backToList(); draw(); return; }
        view = a;
        [].forEach.call(tabs.querySelectorAll('button'), function (x) { x.setAttribute('aria-selected', 'false'); });
        bar.hidden = true;
        draw();
      };
    });
  }

  function backToList() {
    view = 'progress';
    bar.hidden = false;
    tabs.querySelector('[data-view="progress"]').setAttribute('aria-selected', 'true');
  }

  filtersBtn.onclick = function () { buildMenu(); menu.hidden = false; };
  menu.onclick = function (e) { if (e.target === menu) menu.hidden = true; };

  more.onclick = function () {
    var t = tabs.getBoundingClientRect(), sh = manage.parentNode.getBoundingClientRect();
    manage.style.top = Math.max(0, Math.round(t.bottom - sh.top)) + 'px';
    buildManage();
    manage.hidden = false;
  };
  manage.onclick = function (e) { if (e.target === manage) manage.hidden = true; };

  /* ---------------- signing in ---------------- */

  function blocked(text) {
    if (login && login.parentNode) login.remove();
    tabs.hidden = true;
    bar.hidden = true;
    more.hidden = false;
    main.innerHTML = '<div class="err">' + text + '</div>';
  }

  async function enter() {
    var chk = await sb.rpc('is_admin');
    if (chk.error) { blocked('Signed in, but the owner check failed: ' + esc(chk.error.message)); return; }
    if (chk.data !== true) {
      blocked('This email is not on the owner list, so there is nothing to show. ' +
              'Sign out and try the other address.');
      return;
    }
    if (login && login.parentNode) login.remove();
    tabs.hidden = false; more.hidden = false; bar.hidden = false;
    draw();
    if (!refresh) {
      refresh = setInterval(function () {
        if (!SCREENS[view] && sheet.hidden && menu.hidden && manage.hidden) draw();
      }, 60000);
    }
  }

  async function signIn() {
    var msg = document.getElementById('loginMsg');
    var btn = document.getElementById('send');
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!email || !pass) { msg.className = 'err'; msg.textContent = 'Fill in both boxes.'; return; }
    btn.disabled = true;
    msg.className = 'note'; msg.textContent = 'Signing in…';
    var r;
    try { r = await sb.auth.signInWithPassword({ email: email, password: pass }); }
    catch (e) { r = { error: { message: String((e && e.message) || e) } }; }
    btn.disabled = false;

    if (r.error) {
      msg.className = 'err';
      msg.textContent = /invalid login/i.test(r.error.message)
        ? 'That email and password do not match an account.'
        : /not confirmed/i.test(r.error.message)
          ? 'That account still needs confirming in Supabase.'
          : r.error.message;
      return;
    }
    msg.className = 'note'; msg.textContent = 'Opening…';
    // show the panel here and now: reloading used to throw away the fresh session
    await enter();
  }

  document.getElementById('send').onclick = signIn;
  document.getElementById('pass').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
  document.getElementById('email').onkeydown = function (e) {
    if (e.key === 'Enter') document.getElementById('pass').focus();
  };

  async function boot() {
    var s;
    try { s = await sb.auth.getSession(); } catch (e) { return; }
    if (s && s.data && s.data.session) await enter();
  }
  boot();
})();
</script>
</body>
</html>
